name: Atualizar dados do Kworb

on:
  schedule:
    - cron: '17 9 * * *'   # uma vez por dia, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Atualizar data/songs.json e data/songs.js
        run: node tools/atualizar-dados.mjs

      - name: Rodar os testes com os dados novos
        run: node --test

      - name: Commit só se os dados mudaram
        run: |
          if git diff --quiet -- data/ README.md; then
            echo "Dados sem mudança; nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          git commit -m "Atualiza dados do Kworb ($(date -u +%Y-%m-%d))"
          git push
