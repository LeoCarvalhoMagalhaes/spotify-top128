<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spotify Top 128 — The Ultimate Music Bracket</title>
  <meta name="description" content="As 128 músicas mais reproduzidas da história do Spotify em um mata-mata de sete rodadas. Você escolhe a campeã.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23333' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%231ED760'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='%23000'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main" data-action="skip">Pular para o conteúdo</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Spotify Top 128, página inicial">
        <span class="brand-disc" aria-hidden="true"></span>
        <span class="brand-name">Top 128</span>
      </a>
      <nav class="nav" aria-label="Seções do torneio">
        <a href="#/" data-nav="inicio">Início</a>
        <a href="#/confronto" data-nav="confronto">Confronto</a>
        <a href="#/chave" data-nav="chave">Chaveamento</a>
        <a href="#/musicas" data-nav="musicas">Músicas</a>
        <a href="#/estatisticas" data-nav="estatisticas">Estatísticas</a>
        <a href="#/dados" data-nav="dados">Dados</a>
      </nav>
      <div class="topbar-progress" id="topbar-progress" aria-live="off"></div>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main id="main" tabindex="-1">
    <div class="boot">
      <p>Carregando o torneio…</p>
    </div>
  </main>

  <section class="player-dock" id="player-dock" hidden aria-label="Player do Spotify">
    <div class="shell dock-inner">
      <div class="dock-info">
        <span class="dock-label" id="dock-label"></span>
        <strong class="dock-title" id="dock-title"></strong>
        <span class="dock-artist" id="dock-artist"></span>
      </div>
      <div class="dock-embed"><div id="player-embed"></div></div>
      <button type="button" class="btn btn-ghost btn-sm" data-action="player-close">Fechar player</button>
    </div>
  </section>

  <footer class="footer">
    <div class="shell footer-inner">
      <p>Ranking de streams: <a href="https://kworb.net/spotify/songs.html" target="_blank" rel="noopener noreferrer">Kworb</a>, consultado em <span id="footer-date">12/10/2026</span>. Projeto de fãs, sem vínculo com o Spotify.</p>
      <p>O progresso fica salvo só neste navegador.</p>
    </div>
  </footer>

  <div class="visually-hidden" id="live" aria-live="polite" aria-atomic="true"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <dialog class="dialog" id="dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-form" id="dialog-form">
      <h2 class="dialog-title" id="dialog-title"></h2>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-actions" id="dialog-actions"></div>
    </form>
  </dialog>

  <noscript>
    <div class="noscript">Este site precisa de JavaScript para funcionar. Ative o JavaScript no navegador e recarregue a página.</div>
  </noscript>

  <!-- songs.js carrega os mesmos dados de songs.json e permite abrir o site direto do arquivo. -->
  <script src="data/songs.js"></script>
  <script src="script.js"></script>
</body>
</html>
